name: Tests

on:
  push:
    branches: [1.2.x]
  pull_request:
    branches: [1.2.x]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets, pcntl, posix
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer test

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        php: ['7.0', '7.4', '8.0']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sockets, pcntl, posix
          coverage: none
      - run: php tests/Fixtures/compatibility.php
